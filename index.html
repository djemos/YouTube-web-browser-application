<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Web Browser App</title>
	<style>
		:root {
			--bg-body: #0f0f0f;
			--bg-box: #1f1f1f;
			--bg-card: #282828;
			--bg-card-hover: #383838;
			--text-main: #fff;
			--text-sub: #aaa;
			--border-input: #3c3c3c;
			--text-hover: #38bdf8; /* Bright Sky Blue for Dark Theme */
			
			/* Button Colors for Dark Theme */
			--btn-bg: #0066cc;       /* Royal Blue */
			--btn-hover: #0052a3;    /* Darker Blue for hover */
		}

		.light-theme {
			--bg-body: #f9f9f9;
			--bg-box: #ffffff;
			--bg-card: #f1f1f1;
			--bg-card-hover: #e5e5e5;
			--text-main: #000;
			--text-sub: #606060;
			--border-input: #ccc;
			--text-hover: #cc0000; /* Red that you like for Light Theme */
			
			/* Button Colors for Light Theme */
			--btn-bg: #cc0000;       /* Red */
			--btn-hover: #990000;    /* Darker Red for hover */
		}


        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding: 20px; 
            padding-bottom: 90px; 
            transition: background 0.3s, color 0.3s; 
            display: flex;
            flex-direction: column;
        }
        
        .search-container { 
            max-width: 1400px; 
            margin: 0 auto 20px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            flex-shrink: 0; 
            flex-wrap: wrap; 
        }
        input { padding: 12px; width: 400px; border-radius: 20px; border: 1px solid var(--border-input); background: var(--bg-box); color: var(--text-main); padding-left: 20px; font-size: 16px; }
 
        button { 
				padding: 12px 24px; 
				background: var(--btn-bg); /* Changes automatically based on theme */
				color: white; 
				border: none; 
				border-radius: 20px; 
				cursor: pointer; 
				font-weight: bold; 
				font-size: 16px; 
				transition: background 0.2s ease; /* Smooth hover animation */
			}

			button:hover { 
				background: var(--btn-hover); /* Changes automatically based on theme */
			}

        
        .btn-theme { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-input); border-radius: 20px; }
        .btn-theme:hover { background: var(--bg-card-hover); }
        
		.main-layout { 
			display: grid; 
			grid-template-columns: 220px 250px 420px 700px; 
			max-width: 1850px; 
			margin: 0 auto; 
			gap: 15px; 
			flex-grow: 1; 
			width: 100%;
			overflow-x: auto; 
			overflow-y: hidden; /*Prevents the entire page from scrolling down */
			height: calc(100vh - 160px); /* Calculating the height so that it fits exactly above the footer */
			padding-bottom: 15px;
			-webkit-overflow-scrolling: touch;
			box-sizing: border-box;
		}

		.box { 
			background: var(--bg-box); 
			padding: 15px; 
			border-radius: 12px; 
			height: 100%; /* It fills the layout and stops right above the footer. */
			min-height: 0; 
			overflow-y: auto; /* The scrollbar remains within the box itself. */
			border: 1px solid var(--border-input); 
			box-sizing: border-box;
		}

        .box-header { display: flex; justify-content: space-between; align-items: center; margin-top: 0; flex-shrink: 0; }
        .btn-clear-action { background: transparent; color: var(--text-sub); border: none; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; margin: 0; }
        .btn-clear-action:hover { color: #ff0000; }
        .history-item, .fav-item { padding: 8px; margin-bottom: 5px; background: var(--bg-card); border-radius: 6px; cursor: pointer; font-size: 13px; word-break: break-all; }
        .history-item:hover, .fav-item:hover { background: var(--bg-card-hover); color: var(--text-hover);/* color: #cc0000;*/ } 

        
        .video-card { display: flex; gap: 12px; padding: 10px; margin-bottom: 12px; background: var(--bg-card); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .video-card:hover { background: var(--bg-card-hover); }
        .thumbnail-wrapper { position: relative; width: 140px; height: 80px; flex-shrink: 0; }
        .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .duration-badge { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); padding: 2px 6px; font-size: 11px; border-radius: 4px; font-weight: bold; color: #fff; }
        .video-title { font-size: 13px; font-weight: 600; margin: 0 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-channel { font-size: 11px; color: var(--text-sub); margin: 0; }
        
        .player-box { display: none; text-align: center; }
        
        .iframe-container { width: 100%; height: 394px; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 15px; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        
        .volume-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 0px; margin-bottom: 4px;}

        #volumeSlider { width: 150px; }
        #volumeLabel { font-size: 13px; width: 45px; text-align: left; }

        .download-zone { margin-top: 15px; padding: 15px; background: var(--bg-card); border-radius: 8px; display: flex; flex-direction: column; gap: 15px;  margin-top: -15px;}
       
		/* --- STRUCTURAL ROW & GENERAL BUTTONS --- */
		/* Base button styling */
		.btn-dl {
			background: #2ba640;
			font-size: 10px;       
			padding: 6px 10px;     
			white-space: nowrap;   
			display: inline-flex;
			align-items: center;
			gap: 4px;              
		}

		/* General buttons: turn dark green on hover */
		.buttons-row .btn-dl:hover,
		.buttons-row button:hover {
			background: #1e782c !important;
			box-shadow: none !important;
			color: #ffffff !important;
		}

		/* --- FAVORITE BUTTON --- */
		/* Keeps favorite button orange/yellow and prevents it from turning green */
		.btn-fav, 
		.buttons-row .btn-fav,
		.buttons-row button.btn-fav {
			background: #e6a23c !important;
		}
		.btn-fav:hover, 
		.buttons-row .btn-fav:hover,
		.buttons-row button.btn-fav:hover {
			background: #cf8e29 !important;
			box-shadow: none !important;
		}

		/* Loop ON state: Bright Blue with Glow (Stays blue when mouse is not on it) */
		.btn-loop.active,
		.buttons-row .btn-loop.active,
		.buttons-row button.btn-loop.active { 
			background: #007bff !important; 
			box-shadow: 0 0 8px #007bff !important; 
		}

		/* Loop ON state + Mouse Hover: Keeps Blue Background */
		.btn-loop.active:hover,
		.buttons-row button.btn-loop.active:hover {
			background: #007bff !important;
			box-shadow: none !important;
		}

		/* --- AUTOPLAY BUTTON --- */
		.btn-autoplay { background: #2ba640; }

		/* Autoplay ON state: Bright Blue with Glow */
		.btn-autoplay.active,
		.buttons-row button.btn-autoplay.active { 
			background: #007bff !important; 
			box-shadow: 0 0 8px #007bff !important; 
		}

		/* Autoplay ON state + Mouse Hover: Dark Green */
		.btn-autoplay.active:hover,
		.buttons-row button.btn-autoplay.active:hover {
			background: #007bff !important;
			box-shadow: none !important;
		}

        /* Hides the bar in Chrome, Safari, and Opera (Webkit) */
        .buttons-row::-webkit-scrollbar {
            display: none;
        }

		/* Dedicated background padding cushion for the Autoplay button */
		.btn-autoplay {
			padding-right: 8px !important; 
		}

        .progress-container { display: none; background: #444; border-radius: 10px; height: 20px; width: 80%; margin: 0 auto; position: relative; overflow: hidden; }
        .progress-bar { background: #2ba640; height: 100%; width: 0%; transition: width 0.2s ease; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; left: 0; font-size: 12px; line-height: 20px; font-weight: bold; color: #fff; }
         
        .footer {
			position: fixed;
			left: 0;
			bottom: 0;
			width: 100%;
			/* These variables automatically switch colors with the theme */
			background-color: var(--bg-box); 
			color: var(--text-main);             
			border-top: 1px solid var(--border-input);
			
			text-align: center;         
			padding: 15px 0;            
			font-family: Arial, sans-serif;
			font-size: 13px;
			z-index: 9999;
			box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.08); /* Softened shadow so it looks clean on white backgrounds too */
		}
		.mobile-spacer { 
			height: 60px; }

        /* Highlights the active playing track element in list views */
		.video-card.playing-now,
		.fav-item.playing-now {
			border: 2px solid #007bff !important;
			background: rgba(0, 123, 255, 0.1) !important;
			box-shadow: 0 0 8px rgba(0, 123, 255, 0.3) !important;
			font-weight: bold !important;
		}
		
		/* The item currently being dragged */
		.fav-item.dragging-now {
			background: #222 !important;
			opacity: 0.6;
			border-left: 3px solid #00bcd4; /* Blue line on the left side for visual feedback */
		}

		/* The card over which the dragged item is currently hovering */
		.fav-item.drag-over {
			background: #111;
			border-top: 2px dashed #555;
		}
		
		 /* Base button styling */
		.btn-clear-action {
			background-color: transparent;
			font-size: 14px;
			cursor: pointer;
			transition: all 0.3s ease;
			font-family: inherit;
		}

		/* Your custom special styling with a round border */
		.btn-clear-special {
			color: #4da6ff !important; /* Initial color: Blue */
			border: 1px solid rgba(77, 166, 255, 0.3) !important; /* Soft blue border */
			border-radius: 20px; /* Perfectly rounded border */
		}

		/* Hover effect: automatically transitions to red */
		.btn-clear-special:hover {
			color: #ff0000 !important; /* Text turns red */
			border-color: rgba(255, 0, 0, 0.3) !important; /* Border turns red */
		}
   </style>
</head>
<body>
<!-- 21 Languages -->

         <!-- New Playlists / Favorites Box -->

                    </select>
                    <!-- Button to Add a New Playlist -->

						}
						.btn-new-list-special:hover {
							color: #ff0000 !important; /* When the mouse enters: Turns red, then automatically reverts afterwards*/

					<button class="btn-clear-action btn-new-list-special" onclick="createNewPlaylist()" style="padding: 4px 8px; display: block; align-items: center; gap: 4px; text-decoration: none !important; margin-right: 15px;">

						<button class="btn-clear-action" onclick="renameCurrentPlaylist()" style="color: #4da6ff; border: 1px solid rgba(77,166,255,0.4) !important; border-radius: 20px !important; padding: 4px 8px; font-size: 12px; text-decoration: none !important; white-space: nowrap;">

<script>
const translations = {
	en: { // English
		theme: "Theme", search: "Search", history: "History", clear_all: "Clear All",
		new_list: "New List", rename: "Rename", clear: "Clear", delete: "Delete",
		export: "Export", import: "Import", results: "Results", favorite: "Favorite",
		download_mp3: "Download MP3", download_mp4: "Download MP4", prev: "Prev", next: "Next",
		copyright: "Copyright &copy; 2026 Developed by <strong>Dimitris Tzemos</strong>. All rights reserved.",
		search_placeholder: "Search...", search_button: "Search", perform_search: "Perform a search...",

		async function executeSearch(query) {

		// Add this variable globally at the top of your script block, outside functions
		let isRenderingBatch = false;

		function renderNextBatch() {
			const list = document.getElementById('resultsList');
			
			// 1. DUAL-TRIGGER LOCK: If already processing a batch, ignore concurrent calls
			if (isRenderingBatch) {
				return;
			}
			
			// 2. SAFETY CHECK: Stop if no cache is loaded yet
			if (!allCachedResults || allCachedResults.length === 0) {
				return; 
			}

			// Activate the lock
			isRenderingBatch = true;

			// 3. SELF-CORRECTION: Count using 'video-card' to sync with the current DOM state
			const itemsInDOM = list.getElementsByClassName('video-card').length;
			currentShownCount = itemsInDOM;

			const start = currentShownCount;
			const end = Math.min(start + 15, allCachedResults.length);
			
			if (start >= allCachedResults.length) {
				// DYNAMIC TRANSLATION: Pulls the correct message text from your localized dictionary matrix
				const noMoreResultsMsg = translations[currentLang]["no_more_results"] || "There are no further results in memory.";
				alert(noMoreResultsMsg);
				
				isRenderingBatch = false; // Release lock before exiting
				return;
			}

			const imgPrefix = atob("aHR0cHM6Ly9pbWcueW91dHViZS5jb20vdmkv");
			const batch = allCachedResults.slice(start, end);
			
			batch.forEach(video => {
				const thumbUrl = imgPrefix + video.id + "/mqdefault.jpg";
				const card = document.createElement('div');
				card.className = (video.id === currentVideoId) ? 'video-card playing-now' : 'video-card';

				card.setAttribute('data-id', video.id);

				// Add these 2 lines right BEFORE defining card.innerHTML
				card.classList.add('video-item');
				card.setAttribute('data-id', video.id); 
				card.innerHTML = `
					<div class="thumbnail-wrapper">
						<img src="${thumbUrl}" alt="thumb">
						<span class="duration-badge">${video.duration}</span>
					</div>
					<div class="video-info">
						<p class="video-title">${video.title}</p>
						<p class="video-channel">${video.channel}</p>
					</div>
				`;
				list.appendChild(card);
			});

			// 4. Update the layout tracking values sequentially
			currentShownCount = end;
			// 🌟 FIX INSIDE RENDER_NEXT_BATCH: Keep the localization hook safe and fluid
			const resultsTitleEl = document.getElementById("resultsTitle");
			if (resultsTitleEl) {
				// Enforce the tracking data attribute rules for setLanguage loop operations
				resultsTitleEl.setAttribute('data-i18n', 'results'); 
				
				// Fetch the corresponding translation token or fall back cleanly

				resultsTitleEl.innerText = `${resultsLabel} (${currentShownCount})`;
			}


			// 5. RELEASE LOCK: Use a tiny timeout to absorb the duplicate background click event
			setTimeout(() => {
				isRenderingBatch = false;
			}, 100);
		}

		async function playNextVideo() {
			if (!currentVideoId) {
				console.log("No active playing video.");
				return;
			}
			
			trackEndedTriggered = false;
			lastCheckedTime = -1;

			// 1. PLAYLISTS MANAGEMENT (CUSTOM LISTS)
			if (typeof currentQueueType !== 'undefined' && currentQueueType === "playlists") {		
				let playlists = getAllPlaylists();
				
				if (!window.currentPlaylist) {
					const playlistNames = Object.keys(playlists);
					if (playlistNames.length > 0) {
						window.currentPlaylist = playlistNames[0]; 
					} else {
						console.log("No active playlist available for autoplay.");
						return;
					}
				}
				
				let currentList = playlists[window.currentPlaylist] || [];
				if (currentList.length === 0) return;
				
				let currentIndex = currentList.findIndex(v => v.id === currentVideoId);
				
				if (currentIndex !== -1 && currentIndex < currentList.length - 1) {
					let nextVideo = currentList[currentIndex + 1];
					trackEndedTriggered = false;
					lastCheckedTime = -1;
					startPlayback(nextVideo.id, nextVideo.title);
					scrollToActiveTrack(nextVideo.id); 
				} else {
					alert(translations[currentLang]?.end_playlist || translations["en"].end_playlist);
				}
				return; 
			}

			// 2. SEARCH RESULTS MANAGEMENT (SEARCH LIST)
			// Directly plays the next item from your local search results without hitting the server
			if (typeof allCachedResults !== 'undefined' && allCachedResults.length > 0) {
				const currentIdx = allCachedResults.findIndex(video => video.id === currentVideoId);
				
				// If the video is found and it is not the last one in your search list
				if (currentIdx !== -1 && currentIdx < allCachedResults.length - 1) {
					const nextVideo = allCachedResults[currentIdx + 1]; // Takes the exact next video sequentially
					trackEndedTriggered = false;
					lastCheckedTime = -1;
					startPlayback(nextVideo.id, nextVideo.title);
					scrollToActiveTrack(nextVideo.id); 
					return; // Stops here so it doesn't execute the API fetch code below
				} else {
					// Reached the absolute end of the local search results array
					alert(translations[currentLang]?.end_search || translations["en"].end_search);
					return;
				}
			}

			// 3. FALLBACK: Only requests the server backend if allCachedResults is completely empty or missing
			try {
				let targetUrl = baseApiUrl + "/next?current_id=" + currentVideoId + "&list_type=" + currentQueueType;
				let queryParam = (typeof lastQuery !== 'undefined' && lastQuery) ? lastQuery : "";
				if (queryParam) {
					targetUrl += "&q=" + encodeURIComponent(queryParam);
				}

				const response = await fetch(targetUrl);
				if (!response.ok) throw new Error("HTTP error! status: " + response.status);
				
				const data = await response.json();
				if (data.status === "success") {
					trackEndedTriggered = false;
					lastCheckedTime = -1;
					startPlayback(data.next_video.id, data.next_video.title);
					scrollToActiveTrack(data.next_video.id); 
					return;
				} else if (data.status === "end_of_playlist") {
					alert(translations[currentLang]?.end_search || translations["en"].end_search);
					return;
				}
			} catch (error) {
				console.error("Network error during Play Next fallback: ", error.message);
			}
		}

		async function triggerDownload(id, mode) {
			document.getElementById('progressBarContainer').style.display = 'block';
			
			// 🌟 CORRECTED KEY: prog_requesting
			const requestMsg = translations[currentLang]["prog_requesting"] || "Requesting conversion on server...";
			updateProgressBar(0, requestMsg);
			
			// 1. CLEAR ANY EXISTING INTERVAL IMMEDIATELY
			if (typeof progressInterval !== 'undefined') {
				clearInterval(progressInterval);
			}

			try {
				const targetUrl = baseApiUrl + "/download?video_id=" + id + "&mode=" + mode;
				
				// 2. Wait for the server to initiate the download/conversion
				await fetch(targetUrl);
				
				// 3. Start the new interval to check progress every second
				progressInterval = setInterval(function() { 
					checkProgress(id); 
				}, 1000);

			} catch (e) { 
				console.error(e); 
				// 🌟 ΔΙΟΡΘΩΜΕΝΟ ΚΛΕΙΔΙ: prog_conn_error
				const connErrorMsg = translations[currentLang]["prog_conn_error"] || "Error connecting to server.";
				updateProgressBar(0, connErrorMsg);
			}
		}

		async function checkProgress(id) {
			try {
				const targetUrl = baseApiUrl + "/progress?video_id=" + id;
				const response = await fetch(targetUrl);
				const data = await response.json();
				
				if (data.status === "downloading") {
					// 🌟 ΔΙΟРΘΩΜΕΝΟ ΚΛΕΙΔΙ: prog_converting
					const progressPrefix = translations[currentLang]["prog_converting"] || "Conversion on Server: ";
					updateProgressBar(data.percent, `${progressPrefix}${data.percent}%`);
				} 
				else if (data.status === "finished") {
					clearInterval(progressInterval);
					
					// 🌟 ΔΙΟРΘΩΜΕΝΟ ΚΛΕΙΔΙ: prog_ready
					const readyMsg = translations[currentLang]["prog_ready"] || "Ready! Downloading to your device...";
					updateProgressBar(100, readyMsg);
					
					const downloadUrl = baseApiUrl + "/get-file?file_name=" + encodeURIComponent(data.file);
					const nativeLink = document.createElement("a");
					nativeLink.href = downloadUrl;
					nativeLink.style.display = "none";
					document.body.appendChild(nativeLink);
					nativeLink.click(); 
					document.body.removeChild(nativeLink);
					
					setTimeout(() => {
						document.getElementById('progressBarContainer').style.display = 'none';
					}, 4000);
				} 
				else if (data.status === "error") {
					// 🌟 ΔΙΟРΘΩΜΕΝΟ ΚΛΕΙΔΙ: prog_conv_error
					const convErrorMsg = translations[currentLang]["prog_conv_error"] || "Error during conversion.";
					updateProgressBar(0, convErrorMsg);
					clearInterval(progressInterval);
				}
			} catch (e) { console.error(e); }
		}

		function renderFavorites() {
			const container = document.getElementById('favoritesList');
			if (!container) return;

			// 🌟 ΔΙΚΛΕΙΔΑ ΑΣΦΑΛΕΙΑΣ: Αν δεν υπάρχει επιλεγμένη λίστα, σταμάτα για να μην σπάσει το UI

				container.innerHTML = "<span style='color:#888; font-size:12px; padding:10px; display:block;'>No playlist selected. Please select or create one!</span>";
				return;
			}

			// Χρησιμοποιούμε με συνέπεια το window.currentPlaylist
			const activeListKey = window.currentPlaylist;

			// 1. WE READ FROM THE NEW STRUCTURE (yt_playlists) AND NOT FROM yt_favorites
			let playlists = getAllPlaylists();
			let favorites = playlists[activeListKey] || [];
			
			container.innerHTML = favorites.length === 0 ? `<span data-i18n="empty_playlist" style="color:#555;font-size:12px; padding:10px; display:block;">${translations[currentLang]["empty_playlist"]}</span>` : "";		
			favorites.forEach((video, i) => {
				const div = document.createElement('div'); 
				
				// 🌟 ADDED: We give the ID to the element so that auto-scroll can find it
				div.setAttribute('data-id', video.id);
				
				// SAFE CHECK: Avoid crashing if currentVideoId has not been initialized
				const isCurrentPlaying = (typeof currentVideoId !== 'undefined' && video.id === currentVideoId);
				div.className = isCurrentPlaying ? 'fav-item playing-now' : 'fav-item'; 
				
				div.style.display = 'flex'; 
				div.style.justifyContent = 'space-between';
				div.style.alignItems = 'center';
				div.style.transition = 'background 0.2s ease';

				// --- NATIVE DESKTOP DRAG EVENTS ---
				div.ondragover = (e) => { 
					e.preventDefault(); 
					div.classList.add('drag-over'); 
				};
				div.ondragleave = () => { div.classList.remove('drag-over'); };
				div.ondrop = (e) => {
					e.preventDefault();
					div.classList.remove('drag-over');
					const draggedIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
					if (draggedIndex !== i) {
						let playlistsUpdate = getAllPlaylists();
						let favs = playlistsUpdate[activeListKey]; // 🌟 Διορθώθηκε
						if (favs) {
							const [item] = favs.splice(draggedIndex, 1);
							favs.splice(i, 0, item);
							localStorage.setItem("yt_playlists", JSON.stringify(playlistsUpdate));
							renderFavorites(); 
						}
					}
				};

				// 1. ISOLATED DRAG HANDLE (With robust Touch isolation)
				const dragHandle = document.createElement('span');
				dragHandle.innerText = '☰ ';
				dragHandle.style.cursor = 'move';
				dragHandle.style.padding = '12px 16px'; 
				dragHandle.style.color = '#888';
				dragHandle.draggable = true; 
				
				dragHandle.style.userSelect = 'none';
				dragHandle.style.webkitUserSelect = 'none';
				dragHandle.style.webkitTouchCallout = 'none';
				dragHandle.oncontextmenu = (e) => { e.preventDefault(); };

				// MOBILE TOUCH IMPLEMENTATION (Fixed for Firefox Touch Persistence)
				let activeTouchIndex = i;

				dragHandle.ontouchstart = (e) => {
					if (e.cancelable) e.preventDefault();
					div.classList.add('dragging-now');
					activeTouchIndex = i;
				};

				dragHandle.ontouchmove = (e) => {
					if (e.cancelable) e.preventDefault();
					const touch = e.touches[0]; 
					
					const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
					if (!elementUnderTouch) return;
					
					const targetRow = elementUnderTouch.closest('.fav-item');
					if (targetRow && targetRow !== div) {
						const allRows = Array.from(container.children);
						const targetIndex = allRows.indexOf(targetRow);
						
						if (targetIndex !== -1 && activeTouchIndex !== targetIndex) {
							activeTouchIndex = targetIndex;
							
							let playlistsUpdate = getAllPlaylists();
							let favs = playlistsUpdate[activeListKey]; // 🌟 Διορθώθηκε
							if (favs) {
								const [item] = favs.splice(i, 1);
								favs.splice(targetIndex, 0, item);
								localStorage.setItem("yt_playlists", JSON.stringify(playlistsUpdate));
								
								if (targetIndex > i) {
									container.insertBefore(div, targetRow.nextSibling);
								} else {
									container.insertBefore(div, targetRow);
								}
							}
						}
					}
				};
		 
				dragHandle.ontouchend = () => {
					div.classList.remove('dragging-now');
					if (window.getSelection) { window.getSelection().removeAllRanges(); }
					if (document.activeElement) { document.activeElement.blur(); }
					renderFavorites();
				};

				// DESKTOP MOUSE CODES
				dragHandle.ondragstart = (e) => {
					e.dataTransfer.setData('text/plain', i);
					div.classList.add('dragging-now'); 
				};
				dragHandle.ondragend = () => { 
					div.classList.remove('dragging-now'); 
				};
				div.appendChild(dragHandle);

				// 2. Title Element
				const titleSpan = document.createElement('span');
				titleSpan.innerText = video.title;
				titleSpan.style.cursor = 'pointer';
				titleSpan.style.flexGrow = '1';
				titleSpan.onclick = () => {
					currentQueueType = "playlists"; // 🌟 ΑΛΛΑΓΗ: Από "favorites" έγινε "playlists"
					startPlayback(video.id, video.title);
				};
				div.appendChild(titleSpan);

				// 3. Arrow Control Elements
				const reorderContainer = document.createElement('span');
				reorderContainer.style.display = 'flex';
				reorderContainer.style.gap = '5px';
				reorderContainer.style.marginRight = '10px';

				const upBtn = document.createElement('span');
				upBtn.innerText = '▲';
				upBtn.style.cursor = 'pointer';
				upBtn.style.fontSize = '12px';
				if (i === 0) {
					upBtn.style.visibility = 'hidden';
				} else {
					upBtn.onclick = () => moveFavorite(i, -1);
				}

				const downBtn = document.createElement('span');
				downBtn.innerText = '▼';
				downBtn.style.cursor = 'pointer';
				downBtn.style.fontSize = '12px';
				if (i === favorites.length - 1) {
					downBtn.style.visibility = 'hidden';
				} else {
					downBtn.onclick = () => moveFavorite(i, 1);
				}

				reorderContainer.appendChild(upBtn);
				reorderContainer.appendChild(downBtn);
				div.appendChild(reorderContainer);

				// 4. Delete Action Control Span
				const removeBtn = document.createElement('span');
				removeBtn.innerText = ' ❌';
				removeBtn.style.cursor = 'pointer';
				removeBtn.style.padding = '0 5px';
				removeBtn.onclick = (e) => {
					e.stopPropagation();
					removeFromFavorites(video.id);
				};
				div.appendChild(removeBtn);
				
				container.appendChild(div);
			});
		}

		function importPlaylists(event) {
			const file = event.target.files[0]; // Explicitly get the first file
			if (!file) {
				console.log("No file selected.");
				return;
			}

			const reader = new FileReader();
			reader.onload = function(e) {
				try {
					console.log("File loaded successfully. Parsing JSON...");
					let importedData = JSON.parse(e.target.result);
					console.log("Imported Data:", importedData);
					
					// If the file comes from a single playlist export, we convert it to the correct structure
					if (importedData && importedData.type === "single_playlist_export") {
						const normalized = {};
						normalized[importedData.playlistName] = importedData.tracks;
						importedData = normalized;
					}

					// Check if it is a valid object
					if (importedData && typeof importedData === 'object' && !Array.isArray(importedData)) {
						
						// Display the selection window
						// 🌟 DYNAMIC TRANSLATION: Pulls the multi-line import prompt from your language dictionary
						const importMsg = translations[currentLang]["import_prompt"] || 
							"How would you like to import your playlists?\n\nType '1' to SMART MERGE (Combines tracks inside lists, avoids duplicates 🌟)\nType '2' to OVERWRITE (Completely replaces everything with this backup)\n\nCancel or leave blank to abort.";

						const choice = prompt(importMsg);


						console.log("User choice:", choice);
						let currentPlaylists = getAllPlaylists();

						if (choice === "1") {
							// 🌟 TRUE SMART MERGE: Iterate through each playlist individually
							for (const listName in importedData) {
								if (importedData.hasOwnProperty(listName)) {
									
									// If the playlist doesn't exist in the app yet, create it empty
									if (!currentPlaylists[listName]) {
										currentPlaylists[listName] = [];
									}
									
									const importedTracks = importedData[listName];
									if (Array.isArray(importedTracks)) {
										importedTracks.forEach(newVideo => {
											// 🔍 Track check: Does this video.id already exist in this specific playlist?
											const isDuplicate = currentPlaylists[listName].some(existingVideo => existingVideo.id === newVideo.id);
											
											// Only append to the list if it is NOT a duplicate!
											if (!isDuplicate) {
												currentPlaylists[listName].push(newVideo);
											}
										});
									}
								}
							}
							
							localStorage.setItem("yt_playlists", JSON.stringify(currentPlaylists));
							// 🌟 DYNAMIC SUCCESS MERGE MESSAGE:
							const successMergeMsg = translations[currentLang]["success_merge"] || "Playlists merged successfully! All new tracks added, duplicates filtered out.";
							alert(successMergeMsg);
							window.location.reload();					
						 } else if (choice === "2") {
								// ⚠️ OVERWRITE (Full replacement)
								const confirmOverwriteMsg = translations[currentLang]["confirm_overwrite"] || "Are you absolutely sure? This will wipe out all your current playlists and replace them.";
								
								if (confirm(confirmOverwriteMsg)) {
									localStorage.setItem("yt_playlists", JSON.stringify(importedData));
									
									const successOverwriteMsg = translations[currentLang]["success_overwrite"] || "Database overwritten successfully!";
									alert(successOverwriteMsg);
									window.location.reload();
								}
							} else {
								const importCanceledMsg = translations[currentLang]["import_canceled"] || "Import canceled.";
								alert(importCanceledMsg);
							}
							} else {
								const invalidStructureMsg = translations[currentLang]["invalid_structure"] || "Invalid backup file structure. Please ensure it's a valid playlists JSON.";
								alert(invalidStructureMsg);
							}

				} catch (err) {
					console.error("Error during import:", err);
					alert("Error parsing backup file: " + err.message);
				}
			};
			reader.readAsText(file);
			event.target.value = ''; 
		}

		function setLanguage(lang) {
			currentLang = lang;
			localStorage.setItem("app_lang", lang); // Save language selection to browser storage
			
			// 1. Synchronize the Dropdown selection menu value
			const langSelect = document.getElementById('langSelect');
			if (langSelect) {
				langSelect.value = lang;
			}
			
			// 2. Translate plain text in standard HTML components (PROTECTED)
			document.querySelectorAll('[data-i18n]').forEach(element => {
				const id = element.getAttribute('id');
				
				// SAFETY BYPASS: If targeting the results layout elements, DO NOT blindly overwrite content here
				if (id === 'resultsTitle' || id === 'resultsList') {
					return;
				}
				
				const key = element.getAttribute('data-i18n');
				if (translations[lang] && translations[lang][key]) {
					// If it is the copyright, we allow HTML formatting
					if (key === 'copyright') {
						element.innerHTML = translations[lang][key];
					} else {
						element.innerText = translations[lang][key];
					}
				}
			});

			// 3. Translate form Input Placeholders (e.g., search text field prompts)
			document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
				const key = element.getAttribute('data-i18n-placeholder');
				if (translations[lang] && translations[lang][key]) {
					element.placeholder = translations[lang][key];
				}
			});
			
			// 4. INTELLIGENT SEARCH LAYOUT MANAGEMENT (FIXED FOR GREEK/MULTILINGUAL RENDERERS)
			const resultsTitleEl = document.getElementById("resultsTitle");
			const resultsListEl = document.getElementById("resultsList");
			
			// Safely pull the correct translated term from dictionary mapping, otherwise default to English "Results"
			let resultsLabel = "Results";
			if (translations[lang] && translations[lang]["results"]) {
				resultsLabel = translations[lang]["results"];
			}

			// Count live video instances currently drawn inside the container DOM nodes
			const actualVideosCount = resultsListEl ? resultsListEl.querySelectorAll('.video-item, [data-id], .track-item').length : 0;

			if (actualVideosCount > 0) {
				// If active video tracks exist on screen, apply the TRANSLATED text tag alongside the counter number
				if (resultsTitleEl) {
					resultsTitleEl.innerText = `${resultsLabel} (${actualVideosCount})`;
				}
			} else {
				// If the view layer list is completely empty, append the plain translated label alone onto the title header
				if (resultsTitleEl) {
					resultsTitleEl.innerText = resultsLabel;
				}
				if (resultsListEl) {
					const performSearchMsg = (translations[lang] && translations[lang]["perform_search"]) ? translations[lang]["perform_search"] : "Perform a search...";
					resultsListEl.innerHTML = `<span data-i18n="perform_search">${performSearchMsg}</span>`;
				}
			}

			// 5. Dynamic status updates for UI Toggle Indicators (Loop / Autoplay switches)
			const loopTextEl = document.getElementById('loopText');
			if (loopTextEl) {
				const key = isLoopActive ? 'loop_on' : 'loop_off';
				loopTextEl.setAttribute('data-i18n', key);
				loopTextEl.innerText = translations[lang][key];
			}

			const autoplayTextEl = document.getElementById('autoplayText');
			if (autoplayTextEl) {
				const key = isAutoplayActive ? 'autoplay_on' : 'autoplay_off';
				autoplayTextEl.setAttribute('data-i18n', key);
				autoplayTextEl.innerText = translations[lang][key];
			}

			// Automatic language conversion wrapper loop for the informational search-message container element
			const searchMsgEl = document.getElementById('search-message');
			if (searchMsgEl && typeof MAX_RESULTS !== 'undefined') {
				const searchTipTemplate = translations[lang]["search_tip"] || 'Each click on "Search" button returns more results, ranging from 15 up to a maximum of {MAX}.';
				searchMsgEl.textContent = searchTipTemplate.replace('{MAX}', MAX_RESULTS);
			}
		}

</script>
