<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Browser App</title>
    <style>
       /*  :root {
            --bg-body: #0f0f0f;
            --bg-box: #1f1f1f;
            --bg-card: #282828;
            --bg-card-hover: #383838;
            --text-main: #fff;
            --text-sub: #aaa;
            --border-input: #3c3c3c;
        }
        .light-theme {
            --bg-body: #f9f9f9;
            --bg-box: #ffffff;
            --bg-card: #f1f1f1;
            --bg-card-hover: #e5e5e5;
            --text-main: #000;
            --text-sub: #606060;
            --border-input: #ccc;

		:root {
			--bg-body: #0f0f0f;
			--bg-box: #1f1f1f;
			--bg-card: #282828;
			--bg-card-hover: #383838;
			--text-main: #fff;
			--text-sub: #aaa;
			--border-input: #3c3c3c;
			--text-hover: #38bdf8; /* Bright Sky Blue for Dark Theme */
			
			/* Button Colors for Dark Theme */
			--btn-bg: #0066cc;       /* Royal Blue */
			--btn-hover: #0052a3;    /* Darker Blue for hover */
		}

		.light-theme {
			--bg-body: #f9f9f9;
			--bg-box: #ffffff;
			--bg-card: #f1f1f1;
			--bg-card-hover: #e5e5e5;
			--text-main: #000;
			--text-sub: #606060;
			--border-input: #ccc;
			--text-hover: #cc0000; /* Red that you like for Light Theme */
			
			/* Button Colors for Light Theme */
			--btn-bg: #cc0000;       /* Red */
			--btn-hover: #990000;    /* Darker Red for hover */
		}


        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding: 20px; 
            padding-bottom: 90px; 
            transition: background 0.3s, color 0.3s; 
            display: flex;
            flex-direction: column;
        }
        
        .search-container { 
            max-width: 1400px; 
            margin: 0 auto 20px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            flex-shrink: 0; 
            flex-wrap: wrap; 
        }
        input { padding: 12px; width: 400px; border-radius: 20px; border: 1px solid var(--border-input); background: var(--bg-box); color: var(--text-main); padding-left: 20px; font-size: 16px; }
       /* button { padding: 12px 24px; background: #cc0000; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #990000; } */
        button { 
				padding: 12px 24px; 
				background: var(--btn-bg); /* Changes automatically based on theme */
				color: white; 
				border: none; 
				border-radius: 20px; 
				cursor: pointer; 
				font-weight: bold; 
				font-size: 16px; 
				transition: background 0.2s ease; /* Smooth hover animation */
			}

			button:hover { 
				background: var(--btn-hover); /* Changes automatically based on theme */
			}

        
        .btn-theme { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-input); border-radius: 20px; }
        .btn-theme:hover { background: var(--bg-card-hover); }
        
        .main-layout { 
            display: grid; 
            grid-template-columns: 220px 250px 420px 700px; 
            max-width: 1850px; 
            margin: 0 auto; 
            gap: 15px; 
            flex-grow: 1; 
            width: 100%;
            overflow-x: auto; 
            padding-bottom: 15px;
            -webkit-overflow-scrolling: touch;
        }
        
        .box { 
            background: var(--bg-box); 
            padding: 15px; 
            border-radius: 12px; 
            height: calc(100vh - 180px); 
            min-height: 400px;
            overflow-y: auto; 
            border: 1px solid var(--border-input); 
            box-sizing: border-box;
        }
        .box-header { display: flex; justify-content: space-between; align-items: center; margin-top: 0; }
        .btn-clear-action { background: transparent; color: var(--text-sub); border: none; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; margin: 0; }
        .btn-clear-action:hover { color: #ff0000; }
        .history-item, .fav-item { padding: 8px; margin-bottom: 5px; background: var(--bg-card); border-radius: 6px; cursor: pointer; font-size: 13px; word-break: break-all; }
        .history-item:hover, .fav-item:hover { background: var(--bg-card-hover); color: var(--text-hover);/* color: #cc0000;*/ } 

        
        .video-card { display: flex; gap: 12px; padding: 10px; margin-bottom: 12px; background: var(--bg-card); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .video-card:hover { background: var(--bg-card-hover); }
        .thumbnail-wrapper { position: relative; width: 140px; height: 80px; flex-shrink: 0; }
        .thumbnail-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .duration-badge { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); padding: 2px 6px; font-size: 11px; border-radius: 4px; font-weight: bold; color: #fff; }
        .video-title { font-size: 13px; font-weight: 600; margin: 0 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-channel { font-size: 11px; color: var(--text-sub); margin: 0; }
        
        .player-box { display: none; text-align: center; }
        
        .iframe-container { width: 100%; height: 394px; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 15px; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        
        .volume-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        #volumeSlider { width: 150px; }
        #volumeLabel { font-size: 13px; width: 45px; text-align: left; }

        .download-zone { margin-top: 15px; padding: 15px; background: var(--bg-card); border-radius: 8px; display: flex; flex-direction: column; gap: 15px; }
        
         /* All buttons in a single row WITHOUT a visible scroll bar */
      .buttons-row { 
            display: flex;  !important;
            justify-content: flex-start; 
            gap: 8px; 
            flex-wrap: wrap; 
            width: 100%;
            box-sizing: border-box;
            align-items: center;
            overflow-x: auto; 
            padding-bottom: 5px;
            /* Κρύβει τη μπάρα σε Firefox και IE/Edge */
            scrollbar-width: none; 
            -ms-overflow-style: none;  
        }

        /* Hides the bar in Chrome, Safari, and Opera (Webkit) */
        .buttons-row::-webkit-scrollbar {
            display: none;
        }

		/* Master button text compression rule */
		.buttons-row button,
		.buttons-row .btn-dl,
		.buttons-row .btn-dll {
			display: inline-flex !important;
			align-items: center !important;
			justify-content: center !important;
			font-size: 10px !important; /* Slightly smaller text envelope so long words fit */
			font-weight: bold !important;
			padding-left: 2px !important; /* Drops internal side margins to maximum compress text */
			padding-right: 2px !important;
			text-align: center !important;
			white-space: nowrap !important;
			box-sizing: border-box !important;
			min-width: 0 !important;
		}

		/* Dedicated background padding cushion for the Autoplay button */
		.btn-autoplay {
			padding-right: 8px !important; 
		}

        .btn-dl { 
            background: #2ba640; 
            border-radius: 6px; 
            padding: 10px; 
            font-size: 12px !important;
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            flex: 1; 
            min-width: 100px;
            text-align: center  !important;
            white-space: nowrap !important;
            min-height: 45px;
            box-sizing: border-box;
            width: auto !important; /* Kills any hardcoded 'width: 140px' overrides */
			min-width: 0 !important; /* Allows items to shrink below text boundary safely */
			max-width: none !important;
        } 
        
        .btn-dl:hover { background: #1e782c; }
        .btn-fav { background: #e6a23c; }
        .btn-fav:hover { background: #cf8e29; }
        .btn-loop { background: #2ba640; }
        .btn-loop.active { background: #007bff; box-shadow: 0 0 8px #007bff; }
		.btn-autoplay.active {background: #007bff; box-shadow: 0 0 8px #007bff;}


       .btn-dll { 
            background: #0056b3; 
            border-radius: 6px; 
            padding: 10px; 
            font-size: 12px; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            flex: 1; 
            min-width: 100px;
            text-align: center;
            white-space: nowrap; 
            min-height: 45px;
            box-sizing: border-box;
        }
        .btn-dll:hover { background: #004085; }

        .progress-container { display: none; background: #444; border-radius: 10px; height: 20px; width: 80%; margin: 0 auto; position: relative; overflow: hidden; }
        .progress-bar { background: #2ba640; height: 100%; width: 0%; transition: width 0.2s ease; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; left: 0; font-size: 12px; line-height: 20px; font-weight: bold; color: #fff; }

            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: #1a1a1a; 
            color: #ffffff;             
            text-align: center;

        .footer {
			position: fixed;
			left: 0;
			bottom: 0;
			width: 100%;
			/* These variables automatically switch colors with the theme */
			background-color: var(--bg-box); 
			color: var(--text-main);             
			border-top: 1px solid var(--border-input);
			
			text-align: center;         
			padding: 15px 0;            
			font-family: Arial, sans-serif;
			font-size: 13px;
			z-index: 9999;
			box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.08); /* Softened shadow so it looks clean on white backgrounds too */
		}
		.mobile-spacer { 
			height: 60px; }

        /* Highlights the active playing track element in list views */
		.video-card.playing-now,
		.fav-item.playing-now {
			border: 2px solid #007bff !important;
			background: rgba(0, 123, 255, 0.1) !important;
			box-shadow: 0 0 8px rgba(0, 123, 255, 0.3) !important;
			font-weight: bold !important;
		}
		
		/* The item currently being dragged */
		.fav-item.dragging-now {
			background: #222 !important;
			opacity: 0.6;
			border-left: 3px solid #00bcd4; /* Blue line on the left side for visual feedback */
		}

		/* The card over which the dragged item is currently hovering */
		.fav-item.drag-over {
			background: #111;
			border-top: 2px dashed #555;
		}
		
		 /* Base button styling */
		.btn-clear-action {
			background-color: transparent;
			font-size: 14px;
			cursor: pointer;
			transition: all 0.3s ease;
			font-family: inherit;
		}

		/* Your custom special styling with a round border */
		.btn-clear-special {
			color: #4da6ff !important; /* Initial color: Blue */
			border: 1px solid rgba(77, 166, 255, 0.3) !important; /* Soft blue border */
			border-radius: 20px; /* Perfectly rounded border */
		}

		/* Hover effect: automatically transitions to red */
		.btn-clear-special:hover {
			color: #ff0000 !important; /* Text turns red */
			border-color: rgba(255, 0, 0, 0.3) !important; /* Border turns red */
		}
   </style>
</head>
<body>
<div class="search-container">
    <button class="btn-theme" onclick="toggleTheme()">🌓 Theme</button>
    
    <!-- Using a <form> to automatically capture Enter and clicks -->
    <!--  <form id="searchForm" onsubmit="event.preventDefault(); executeSearch(document.getElementById('queryInput').value);" style="display: flex; flex-grow: 1; gap: inherit; align-items: center; margin: 0;">-->
		<form id="searchForm" style="display: flex; flex-grow: 1; gap: inherit; align-items: center; margin: 0;">
        <input type="text" id="queryInput" placeholder="Search...">
        <button type="submit">Search</button>
    </form>
    
    <div id="search-message" style="display: block; width: 100%; flex-basis: 100%; text-align: center; margin-top: 10px; color: var(--text-sub); font-size: 14px;">
        <!-- JavaScript will insert the text here -->
    </div>
</div>

    <div class="main-layout">
		<div class="box">
			<div class="box-header">
				<h3>History</h3>
				
				<!-- Clear All button with the custom style and clean structure -->
				<button class="btn-clear-action btn-clear-special" onclick="clearHistory()" style="padding: 4px 10px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none !important;">
					<!-- The 🗑️ icon is clean with no line underneath -->
					<span style="filter: var(--emoji-filter, none); display: inline-block;">🗑️</span> 
					<!-- Underline applies ONLY to the "Clear All" text string -->
					<span style="text-decoration: underline;">Clear All</span>
				</button>
			</div>
			<div id="historyList"></div>
		</div>
        
         <!-- New Playlists / Favorites Box -->
        <div class="box">
            <div class="box-header" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;">
                <!-- Left section: Playlist Selector and New only -->
                <div style="display: flex; align-items: center; gap: 8px;">
                    <!-- Playlist Selector instead of simple text -->
                    <select id="playlistSelector" onchange="changePlaylist(this.value)" style="padding: 4px 8px; font-size: 16px; font-weight: bold; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; max-width: 140px;">
                        <!-- Will be populated dynamically by JavaScript -->
                    </select>
                    <!-- Button to Add a New Playlist -->
					<!-- Τοπικό στυλ αποκλειστικά για το κουμπί New List -->
					<style>
						.btn-new-list-special {
							color: #4da6ff !important; /* Αρχικό χρώμα: Μπλε */
							border: 1px solid rgba(77, 166, 255, 0.3) !important; /* Απαλό μπλε περίγραμμα */
						}
						.btn-new-list-special:hover {
							color: #ff0000 !important; /* Όταν μπαίνει το ποντίκι: Κόκκινο και επιστρέφει αυτόματα μετά */
						}
					</style>

					<!-- Το κουμπί σας με τη νέα κλάση ενσωματωμένη -->
					<button class="btn-clear-action btn-new-list-special" onclick="createNewPlaylist()" style="padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none !important;">
						<!-- The ➕ is now 100% clean with no line underneath -->
						<span style="filter: var(--emoji-filter, none); display: inline-block;">➕</span> 
						<!-- We apply the underline ONLY to the "New List" text string -->
						<span style="text-decoration: underline;">New List</span>
					</button>
                </div>
             
                <!-- Right section: Rename, Clear and Delete grouped together -->
				<div style="display: flex; flex-direction: column; gap: 6px; width: 100%; justify-content: flex-start; margin-bottom: 12px;">
	
					<!-- ROW 1: Rename, Clear, Delete (Συμπυκνωμένα για να χωράνε 100% σε 1 γραμμή) -->
					<div style="display: flex; gap: 4px; align-items: center; justify-content: flex-start; width: 100%;">
						<!-- 📝 Rename Button -->
						<button class="btn-clear-action" onclick="renameCurrentPlaylist()" style="color: #4da6ff; border: 1px solid rgba(77,166,255,0.4) !important; border-radius: 20px !important; padding: 4px 8px; font-size: 12px; text-decoration: none !important; white-space: nowrap;">
							<span style="filter: var(--emoji-filter, none); display: inline-block; text-decoration: none !important;">📝</span> 
							<span style="text-decoration: underline;">Rename</span>
						</button>

						<!-- 🧹 Clear Button -->
						<button class="btn-clear-action" onclick="clearCurrentPlaylist()" style="border: 1px solid var(--border, rgba(255,255,255,0.2)) !important; border-radius: 20px !important; padding: 4px 8px; font-size: 12px; text-decoration: none !important; white-space: nowrap;">
							<span style="filter: var(--emoji-filter, none); display: inline-block; text-decoration: none !important;">🧹</span> 
							<span style="text-decoration: underline;">Clear</span>
						</button>

						<!-- 🗑️ Delete Button -->
						<button class="btn-clear-action" onclick="deleteCurrentPlaylist()" style="color: #ff4d4d; border: 1px solid rgba(255,77,77,0.4) !important; border-radius: 20px !important; padding: 4px 8px; font-size: 12px; text-decoration: none !important; white-space: nowrap;">
							<span style="filter: var(--emoji-filter, none); display: inline-block; text-decoration: none !important;">🗑️</span> 
							<span style="text-decoration: underline;">Delete</span>
						</button>
					</div>

					<!-- ROW 2: Export and Import -->
					<div style="display: flex; gap: 4px; align-items: center; justify-content: flex-start; width: 100%;">
						<!-- 📥 Export Button -->
						<button class="btn-clear-action" onclick="exportPlaylists()" style="color: #4da6ff; border: 1px solid rgba(77,166,255,0.4) !important; border-radius: 20px !important; padding: 4px 8px; font-size: 12px; text-decoration: none !important; white-space: nowrap;">
							<span style="filter: var(--emoji-filter, none); display: inline-block; text-decoration: none !important;">📥</span> 
							<span style="text-decoration: underline;">Export</span>
						</button>
						
						<!-- 📤 Import Button -->
						<button class="btn-clear-action" onclick="document.getElementById('importFileHidden').click()" style="color: #2ecc71; border: 1px solid rgba(46,204,113,0.4) !important; border-radius: 20px !important; padding: 4px 8px; font-size: 12px; text-decoration: none !important; white-space: nowrap;">
							<span style="filter: var(--emoji-filter, none); display: inline-block; text-decoration: none !important;">📤</span> 
							<span style="text-decoration: underline;">Import</span>
						</button>
						
						<!-- Hidden File Input -->
						<input type="file" id="importFileHidden" accept=".json" onchange="importPlaylists(event)" style="display: none !important;">
					</div>
				</div>
            </div>
            <!-- The videos of the selected playlist will be displayed here -->
            <div id="favoritesList"></div>
        </div>

        <div class="box" id="resultsBox" style="opacity: 0.5;">
            <h3 style="margin-top:0;" id="resultsTitle">Results</h3>
            <div id="resultsList">Perform a search...</div>
        </div>
        <div class="box player-box" id="mainPlayer">
            <h2 id="currentTitle" style="font-size:18px; text-align:left; margin-top:0;"></h2>
            
            <div class="iframe-container">
                <iframe id="youtubeEmbed" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="volume-container">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="100" oninput="changeVolume(this.value)">
                <span id="volumeLabel">100%</span>
            </div>
            <div class="download-zone">
                <!--ALL buttons were placed in a SINGLE row, without an Autoplay checkbox -->
                <div class="buttons-row">
                    <button class="btn-dl btn-fav" id="favButton" onclick="addCurrentToFavorites()">⭐ Favorite</button>
                    <button class="btn-dl btn-loop" id="loopToggle" onclick="toggleLoop()">🔁 Loop: OFF</button>
                    <button id="autoplayToggle" class="btn-dl btn-autoplay active" onclick="toggleAutoplay()">⏭️ Autoplay: ON</button>
                    <button class="btn-dl" id="dlMp3">Download MP3</button>
                    <button class="btn-dl" id="dlMp4">Download MP4</button>
                    <button class="btn-dl" id="prevButton" onclick="playPreviousVideo()">⏮️ Prev</button>
                    <button class="btn-dl" id="nextButton" onclick="playNextVideo()">⏭️ Next</button>
                </div>
                <div class="progress-container" id="progressBarContainer">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>
        </div>
    </div>
    <div class="mobile-spacer"></div>
    <div class="footer">
        &copy; 2026 Developed by <strong>Dimitris Tzemos</strong>. All rights reserved 
    </div>
	<script>
		
		const savedTheme = localStorage.getItem("theme");
		if (savedTheme === "dark" || !savedTheme) { // αν είναι dark ή αν δεν έχει επιλεγεί τίποτα ακόμα
			document.documentElement.style.setProperty('--emoji-filter', 'invert(1) brightness(2)');
		} else {
			document.documentElement.style.setProperty('--emoji-filter', 'none');
		}

        let progressInterval = null;
        let isLoopActive = false;
        let currentVideoId = "";
        let currentVideoTitle = "";
        let currentVolume = 100;
        let isAutoplayActive = true; // Autoplay is enabled by default
        
        // ADDED FOR FAVORITES AUTOPLAY ROUTING:
        let currentQueueType = "search"; // Tracks current playback context: 'search' or 'favorites'

        let lastQuery = "";
        let currentShownCount = 0;
        let allCachedResults = [];
        let MAX_HISTORY_ITEMS = 100;
		let MAX_RESULTS = 100;
		
		document.getElementById('search-message').textContent = 
			`Each click on "Search" button returns more results, ranging from 15 up to a maximum of ${MAX_RESULTS}.`;

        const baseApiUrl = window.location.origin + "/ytapp";
		document.addEventListener("DOMContentLoaded", function() {
		// 1. INTERCEPTOR: Modified to block deep linking and prevent opening the YouTube app on mobile phones
		(function() {
			const iframe = document.getElementById('youtubeEmbed');
			if (!iframe) return;

			const descriptor = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'src');
			
			Object.defineProperty(iframe, 'src', {
				set: function(value) {
					if (value && value.includes('youtube.com')) {
						// Convert to embed format and swap to the nocookie domain to isolate inside the browser
						if (!value.includes('/embed/')) {
							const urlParams = new URLSearchParams(value.substring(value.indexOf('?')));
							const videoId = urlParams.get('v');
							if (videoId) {
								value = `https://youtube-nocookie.com{videoId}`;
							}
						} else {
							value = value.replace('youtube.com', 'youtube-nocookie.com');
						}

						// Append required desktop bypass and autoplay parameters securely
						const separator = value.includes('?') ? '&' : '?';
						if (!value.includes('cver=Desktop')) {
							value = value + separator + "html5=1&cbr=Chrome&cver=Desktop&autoplay=1&origin=" + encodeURIComponent(window.location.origin);
						}
					}
					descriptor.set.call(this, value);
				},
				get: function() {
					return descriptor.get.call(this);
				}
			});
		})();

			// 2. Your original app initialization logic
			renderHistory();
			renderFavorites();
			renderPlaylistSelector();
			renderFavorites(); 
			if(localStorage.getItem("theme") === "light") {
				document.body.classList.add("light-theme");
			}
			
			// Your working volume listener
			document.getElementById('youtubeEmbed').addEventListener('load', function() {
				setTimeout(() => { changeVolume(currentVolume); }, 1000);
			});

			// 3. FIXED MESSAGE LISTENER: Standard loop-only behavior remains un-touched
			window.addEventListener('message', function(event) {
				try {
					const data = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
					if (data.event === "infoDelivery" && data.info && data.info.playerState !== undefined) {
						const state = data.info.playerState;
						if (state === 0 && isLoopActive) {
							updatePlayerSrc();
						}
					}
				} catch (e) {}
			});
			
			let lastCheckedTime = -1;
			let trackEndedTriggered = false;

			// The interval routine only pings the target iframe once per second
			setInterval(function() {
				const iframe = document.getElementById('youtubeEmbed');
				if (!iframe || !iframe.src) return;
				try {
					iframe.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}', '*');
				} catch(e) {}
			}, 1000);

			// The standalone listener handles player status messages globally
			window.addEventListener('message', function(e) {
				try {
					const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
					if (data.event === "infoDelivery" && data.info) {
						const currentTime = data.info.currentTime;
						const duration = data.info.duration;
						const state = data.info.playerState;

						if (Math.abs(currentTime - lastCheckedTime) > 2.0 || currentTime < lastCheckedTime) {
							trackEndedTriggered = false;
						}
						lastCheckedTime = currentTime;

						const isAtFinalSecond = (currentTime && duration && (duration - currentTime <= 1.0));
						const isStateEnded = (state === 0);

						if (isStateEnded || isAtFinalSecond) {
							if (!trackEndedTriggered && currentTime > 0) {
								trackEndedTriggered = true; 
								
								if (isLoopActive) {
									updatePlayerSrc();
								} else if (isAutoplayActive) {
									lastCheckedTime = -1;
									trackEndedTriggered = false; 
									playNextVideo();
								} else {
									console.log("Autoplay is OFF. Stopping playback flow.");
								}
							}
						}
					}
				} catch(err) {}
			});

			// The search form submission listener is now correctly contained inside DOMContentLoaded
			document.getElementById('searchForm').addEventListener('submit', function(event) {
				event.preventDefault(); 
				
				let query = document.getElementById('queryInput').value;
				if (query.trim() !== "") { 
					executeSearch(query); 
				}
			});
		});

		// 1. DEFINE THE GLOBAL VARIABLE AT THE BEGINNING OF THE CODE
		if (typeof currentPlaylist === 'undefined') {
			window.currentPlaylist = "Favorites";

		// 2. SAFE LOADING OF ALL PLAYLISTS
		function getAllPlaylists() {

			if (!playlists || Array.isArray(playlists) || typeof playlists !== 'object') {
				playlists = { "Favorites": [] };
				localStorage.setItem("yt_playlists", JSON.stringify(playlists));

			return playlists;

		async function executeSearch(query) {
			if(!query) return;
			const list = document.getElementById('resultsList');
			document.getElementById('resultsBox').style.opacity = "1";

			if (query === lastQuery && allCachedResults.length > 0) {
				renderNextBatch();
				return;
			}
			
			// Reset layout rules for a NEW query execution
			currentShownCount = 0;
			allCachedResults = [];
			lastQuery = query;
			
			saveToHistory(query);
			list.innerHTML = "<p>Searching...</p>";
			document.getElementById('queryInput').value = query;

			// === ADD THIS LINE HERE ===
			// Instantly wipes the old counter out as soon as Enter/Search is triggered
			document.getElementById("resultsTitle").innerText = "Results (...)"; 

			try {
				const targetUrl = baseApiUrl + "/search?q=" + encodeURIComponent(query);
				const response = await fetch(targetUrl);
				if (!response.ok) throw new Error("HTTP error! status: " + response.status);
				
				const data = await response.json();
				list.innerHTML = "";

				if(data.status === "success" && data.results && data.results.length > 0) {
					allCachedResults = data.results;
					renderNextBatch(); // This will automatically display "Results (15)" when elements render
				} else {
					list.innerHTML = "<p style='color:red;'>No results found on YouTube.</p>";
					document.getElementById("resultsTitle").innerText = "Results (0)";
				}
			} catch (error) {
				list.innerHTML = "<p style='color:red;'>API connection error: " + error.message + "</p>";
				document.getElementById("resultsTitle").innerText = "Results (Error)";
			}
		}

		// Add this variable globally at the top of your script block, outside functions
		let isRenderingBatch = false;

		function renderNextBatch() {
			const list = document.getElementById('resultsList');
			
			// 1. DUAL-TRIGGER LOCK: If already processing a batch, ignore concurrent calls
			if (isRenderingBatch) {
				return;
			}
			
			// 2. SAFETY CHECK: Stop if no cache is loaded yet
			if (!allCachedResults || allCachedResults.length === 0) {
				return; 
			}

			// Activate the lock
			isRenderingBatch = true;

			// 3. SELF-CORRECTION: Count using 'video-card' to sync with the current DOM state
			const itemsInDOM = list.getElementsByClassName('video-card').length;
			currentShownCount = itemsInDOM;

			const start = currentShownCount;
			const end = Math.min(start + 15, allCachedResults.length);
			
			if (start >= allCachedResults.length) {
				alert("There are no further results in memory.");
				isRenderingBatch = false; // Release lock before exiting
				return;
			}
			
			const imgPrefix = atob("aHR0cHM6Ly9pbWcueW91dHViZS5jb20vdmkv");
			const batch = allCachedResults.slice(start, end);
			
			batch.forEach(video => {
				const thumbUrl = imgPrefix + video.id + "/mqdefault.jpg";
				const card = document.createElement('div');
				card.className = (video.id === currentVideoId) ? 'video-card playing-now' : 'video-card';
				
				// FIX: Attach the video ID to the DOM element so startPlayback() can safely read it
				card.setAttribute('data-id', video.id);

				card.onclick = function() { 
					currentQueueType = "search"; 
					startPlayback(video.id, video.title); 
				};
			
				// Add these 2 lines right BEFORE defining card.innerHTML
				card.classList.add('video-item');
				card.setAttribute('data-id', video.id); 
				card.innerHTML = `
					<div class="thumbnail-wrapper">
						<img src="${thumbUrl}" alt="thumb">
						<span class="duration-badge">${video.duration}</span>
					</div>
					<div class="video-info">
						<p class="video-title">${video.title}</p>
						<p class="video-channel">${video.channel}</p>
					</div>
				`;
				list.appendChild(card);
			});

			// 4. Update the layout tracking values sequentially
			currentShownCount = end;
			document.getElementById("resultsTitle").innerText = "Results (" + currentShownCount + ")";

			// 5. RELEASE LOCK: Use a tiny timeout to absorb the duplicate background click event
			setTimeout(() => {
				isRenderingBatch = false;
			}, 100);
		}
			
		function startPlayback(id, title) { 
			clearInterval(progressInterval); 
			currentVideoId = id; 
			currentVideoTitle = title; 
			
			document.getElementById('progressBarContainer').style.display = 'none'; 
			document.getElementById('currentTitle').innerText = title; 
			
			updatePlayerSrc(); 
			document.getElementById('mainPlayer').style.display = 'block'; 
			
			// Force re-render execution loops to apply highlights dynamically across both list trays 
			renderFavorites(); 
			
			// Safely re-apply search layout highlights if results are actively loaded in memory cache 
			const resultsList = document.getElementById('resultsList'); 
			if (resultsList && resultsList.innerHTML !== "") { 
				// Loop through all currently rendered video elements on screen 
				const cards = resultsList.getElementsByClassName('video-card'); 
				for (let i = 0; i < cards.length; i++) { 
					
					// FIX: Retrieve the video ID directly from the card element
					const cardId = cards[i].getAttribute('data-id');
					
					// Check if this card's ID matches the newly playing video ID
					const isCurrent = (cardId === String(id)); 
					cards[i].className = isCurrent ? 'video-card playing-now' : 'video-card'; 
				} 
			}

			// 🌟 Εκτελούμε το αυτόματο scroll στο τέλος της συνάρτησης
			if (typeof scrollToActiveTrack === 'function') {
				scrollToActiveTrack(id);
			}
		}

        function updatePlayerSrc() {

            // Clean URL for an individual video (Autoplay logic has been completely removed)

		function deleteCurrentPlaylist() {
			// 1. Protect the default Favorites playlist
			if (window.currentPlaylist === "Favorites") {
				alert("The default 'Favorites' playlist cannot be deleted!");
				return;
			}

			// 2. User confirmation
			if (confirm(`Are you sure you want to permanently DELETE the entire playlist "${window.currentPlaylist}" and all its videos?`)) {

				delete playlists[window.currentPlaylist];

				// 4. Refresh the UI (Dropdown menu and video list)

			}
		}

		async function playNextVideo() {
			if (!currentVideoId) {
				console.log("No active playing video.");
				return;
			}
			
			trackEndedTriggered = false;
			lastCheckedTime = -1;

			// 1. PLAYLISTS / FAVORITES MANAGEMENT (Local change without errors)
			if (typeof currentQueueType !== 'undefined' && currentQueueType === "favorites") {
				if (!window.currentPlaylist) window.currentPlaylist = "Favorites";
				
				let playlists = getAllPlaylists();
				let currentList = playlists[window.currentPlaylist] || [];
				
				if (currentList.length === 0) return;
				
				let currentIndex = currentList.findIndex(v => v.id === currentVideoId);
				
				if (currentIndex !== -1 && currentIndex < currentList.length - 1) {
					let nextVideo = currentList[currentIndex + 1];
					trackEndedTriggered = false;
					lastCheckedTime = -1;
					startPlayback(nextVideo.id, nextVideo.title);
					scrollToActiveTrack(nextVideo.id); // <--- Added: Scroll list to next track
				} else {
					alert("You have reached the end of the current playlist!");
				}
				return; // Stops here for playlists
			}

			// 2. SEARCH RESULTS MANAGEMENT (SEARCH LIST)
			try {
				let targetUrl = baseApiUrl + "/next?current_id=" + currentVideoId + "&list_type=" + currentQueueType;
				
				// Ασφάλεια για το query της αναζήτησης
				let queryParam = (typeof lastQuery !== 'undefined' && lastQuery) ? lastQuery : "";
				if (queryParam) {
					targetUrl += "&q=" + encodeURIComponent(queryParam);
				}

				const response = await fetch(targetUrl);
				if (!response.ok) throw new Error("HTTP error! status: " + response.status);
				
				const data = await response.json();
				if (data.status === "success") {
					trackEndedTriggered = false;
					lastCheckedTime = -1;
					startPlayback(data.next_video.id, data.next_video.title);
					scrollToActiveTrack(data.next_video.id); // <--- Added: Scroll list to next track
					return;
				} else if (data.status === "end_of_playlist") {
					alert("You have reached the end of the search results!");
					return;
				}
			} catch (error) {
				console.error("Network error during Play Next, falling back to local cache: ", error.message);
			}

			// FALLBACK: If the API fails or lastQuery doesn't exist, the song changes locally from the search results
			if (typeof allCachedResults !== 'undefined' && allCachedResults.length > 0) {
				const currentIdx = allCachedResults.findIndex(video => video.id === currentVideoId);
				if (currentIdx !== -1 && currentIdx < allCachedResults.length - 1) {
					const nextVideo = allCachedResults[currentIdx + 1];
					trackEndedTriggered = false;
					lastCheckedTime = -1;
					startPlayback(nextVideo.id, nextVideo.title);
					scrollToActiveTrack(nextVideo.id); // <--- Added: Scroll list to next track
				} else {
					alert("You have reached the end of search results!");
				}
			}
		}

		function playPreviousVideo() {
			if (!currentVideoId) {
				console.log("No active video.");
				return;
			}
			
			let videosList = [];
			
			// 1. IF PLAYING FROM PLAYLISTS / FAVORITES
			if (typeof currentQueueType !== 'undefined' && currentQueueType === "favorites") {
				if (!window.currentPlaylist) window.currentPlaylist = "Favorites";
				let playlists = getAllPlaylists();
				videosList = playlists[window.currentPlaylist] || [];
			} 
			// 2. IF PLAYING FROM SEARCH RESULTS (SEARCH LIST)
			else {
				videosList = (typeof allCachedResults !== 'undefined') ? allCachedResults : [];
			}

			if (videosList.length === 0) {
				console.log("Current playing list is empty.");
				return;
			}
			
			const currentIdx = videosList.findIndex(video => video.id === currentVideoId);
			
			if (currentIdx > 0) {
				const prevVideo = videosList[currentIdx - 1];
				console.log("⏮️ Playing previous video: " + prevVideo.title);
				startPlayback(prevVideo.id, prevVideo.title);
				scrollToActiveTrack(prevVideo.id); // <--- Added: Scroll list to previous track
			} else {
				alert("You are already at the first song of the list!");
			}
		}

		function scrollToActiveTrack(videoId) {
			// 1. Αφαιρούμε το active highlight από το προηγούμενο τραγούδι σε όλες τις λίστες
			const previousActive = document.querySelectorAll('.video-item.active, .playlist-item.active, .song-item.active');
			previousActive.forEach(el => el.classList.remove('active'));

			// 2. Βρίσκουμε ΟΛΑ τα στοιχεία που έχουν αυτό το videoId (και στη Search List και στη λίστα stratos)
			const currentElements = document.querySelectorAll(`[data-id="${videoId}"], [id="video-${videoId}"]`);
			
			// 3. Κάνουμε ακριβώς το ίδιο scrollIntoView για ΚΑΘΕ στοιχείο ξεχωριστά
			currentElements.forEach(element => {
				// Προσθέτουμε την κλάση active για το visual εφέ
				element.classList.add('active');
				
				// Χρησιμοποιούμε την ίδια ακριβώς εντολή που δούλεψε στη Search List
				// Ο browser θα αναλάβει να σκρολάρει τον αντίστοιχο container της κάθε λίστας
				element.scrollIntoView({
					behavior: 'smooth',
					block: 'center'
				});
			});
		}

        async function triggerDownload(id, mode) {
            document.getElementById('progressBarContainer').style.display = 'block';
            updateProgressBar(0, "Requesting conversion on server...");
            try {
                const targetUrl = baseApiUrl + "/download?video_id=" + id + "&mode=" + mode;
                await fetch(targetUrl);
                clearInterval(progressInterval);
                progressInterval = setInterval(function() { checkProgress(id); }, 1000);
            } catch (e) { console.error(e); }
        }

        async function checkProgress(id) {
            try {
                const targetUrl = baseApiUrl + "/progress?video_id=" + id;
                const response = await fetch(targetUrl);
                const data = await response.json();
                
                if (data.status === "downloading") {
                    updateProgressBar(data.percent, "Conversion on Server: " + data.percent + "%");
                } 
                else if (data.status === "finished") {
                    clearInterval(progressInterval);
                    updateProgressBar(100, "Ready! Downloading to your device...");
                    
                    const downloadUrl = baseApiUrl + "/get-file?file_name=" + encodeURIComponent(data.file);
                    const nativeLink = document.createElement("a");
                    nativeLink.href = downloadUrl;
                    nativeLink.style.display = "none";
                    document.body.appendChild(nativeLink);
                    nativeLink.click(); 
                    document.body.removeChild(nativeLink);
                    
                    setTimeout(() => {
                        document.getElementById('progressBarContainer').style.display = 'none';
                    }, 4000);
                } 
                else if (data.status === "error") {
                    updateProgressBar(0, "Error during conversion.");
                    clearInterval(progressInterval);
                }
            } catch (e) { console.error(e); }
        }

        function updateProgressBar(percent, text) {
            document.getElementById('progressBar').style.width = percent + "%";
            document.getElementById('progressText').innerText = text;
        }
		
        function saveToHistory(query) {
            let history = JSON.parse(localStorage.getItem("yt_history")) || [];
            history = history.filter(item => item !== query);
            history.unshift(query);
            if(history.length > MAX_HISTORY_ITEMS) history.pop();
            localStorage.setItem("yt_history", JSON.stringify(history));
            renderHistory();
        }

		function removeFromHistory(query) {
			let history = JSON.parse(localStorage.getItem("yt_history")) || [];
			history = history.filter(item => item !== query);
			localStorage.setItem("yt_history", JSON.stringify(history));
			renderHistory();
		}

		function renderHistory() {
			const container = document.getElementById('historyList');
			let history = JSON.parse(localStorage.getItem("yt_history")) || [];
			container.innerHTML = history.length === 0 ? "<span style='color:#555;font-size:13px;'>Empty history</span>" : "";
			
			history.forEach(item => {
				const div = document.createElement('div'); 
				div.className = 'history-item'; 
				div.style.display = 'flex'; 
				div.style.justifyContent = 'space-between';
				div.style.alignItems = 'center';

				const textSpan = document.createElement('span');
				textSpan.innerText = item;
				textSpan.style.cursor = 'pointer';
				textSpan.style.flexGrow = '1';
				textSpan.onclick = () => executeSearch(item);
				div.appendChild(textSpan);
				const removeBtn = document.createElement('span');
				removeBtn.innerText = '❌';
				removeBtn.style.cursor = 'pointer';
				removeBtn.style.padding = '0 5px';
				removeBtn.style.fontSize = '12px';
				removeBtn.onclick = (e) => {
					e.stopPropagation();
					removeFromHistory(item);
				};
				div.appendChild(removeBtn);
				container.appendChild(div);
			});
		}

        function clearHistory() { localStorage.removeItem("yt_history"); renderHistory(); }

		function addCurrentToFavorites() {
			if (!window.currentPlaylist) {
				window.currentPlaylist = "Favorites";
			}

			let detectedVideoId = null;
			const iframe = document.getElementById('youtubeEmbed');
			
			// CORRECTION: Smarter extraction of the ID from the iframe URL
			if (iframe && iframe.src) {
				const srcText = iframe.src;
				// If the URL contains /embed/
				if (srcText.includes('embed/')) {
					const parts = srcText.split('embed/');
					if (parts[1]) {
						// We get the ID by stripping any parameters like ?autoplay=1
						detectedVideoId = parts[1].split('?')[0].split('&')[0].trim();
					}
				} 
				// If the URL is standard ://youtube.com
				else if (srcText.includes('v=')) {
					const parts = srcText.split('v=');
					if (parts[1]) {
						detectedVideoId = parts[1].split('&')[0].trim();
					}
				}
			}

			// If the iframe fails, we try the classic global variable (if it exists)
			if (!detectedVideoId && typeof currentVideoId !== 'undefined' && currentVideoId) {
				detectedVideoId = currentVideoId;
			}

			// Critical check: If the ID is empty, we stop to prevent corrupting the storage memory
			if (!detectedVideoId || detectedVideoId === "") {
				alert("No valid video ID was found! Please play a song first.");
				return;
			}
			
			let playlists = getAllPlaylists();
			
			if (!playlists[window.currentPlaylist]) {
				playlists[window.currentPlaylist] = [];
			}
			
			// Check if the video already exists in this specific playlist
			const exists = playlists[window.currentPlaylist].some(v => v.id === detectedVideoId);
			if (exists) {
				alert(`This video is already in your "${window.currentPlaylist}" playlist!`);
				return;
			}
			
			// Finding the title from your h2 element (#currentTitle)
			let videoTitle = "YouTube Video";
			const titleEl = document.getElementById('currentTitle');
			if (titleEl && titleEl.innerText.trim() !== "") {
				videoTitle = titleEl.innerText.trim();
			}
			
			// Add to the playlist array
			playlists[window.currentPlaylist].push({ 
				id: detectedVideoId, 
				title: videoTitle 
			});
			
			localStorage.setItem("yt_playlists", JSON.stringify(playlists));
			
			// Refresh the screen display
			renderFavorites();
		}

        function removeFromFavorites(id) {
			let favorites = JSON.parse(localStorage.getItem("yt_favorites")) || [];
			favorites = favorites.filter(item => item.id !== id);
			localStorage.setItem("yt_favorites", JSON.stringify(favorites));
			renderFavorites();
		}

		function renderFavorites() {
			const container = document.getElementById('favoritesList');
			if (!container) return;

			// 1. WE READ FROM THE NEW STRUCTURE (yt_playlists) AND NOT FROM yt_favorites
			let playlists = getAllPlaylists();
			let favorites = playlists[currentPlaylist] || [];
			
			container.innerHTML = favorites.length === 0 ? "<span style='color:#555;font-size:12px;'>Empty</span>" : "";
			
			favorites.forEach((video, i) => {
				const div = document.createElement('div'); 
				
				// 🌟 ADDED: We give the ID to the element so that auto-scroll can find it
				div.setAttribute('data-id', video.id);
				
				// SAFE CHECK: Avoid crashing if currentVideoId has not been initialized
				const isCurrentPlaying = (typeof currentVideoId !== 'undefined' && video.id === currentVideoId);
				div.className = isCurrentPlaying ? 'fav-item playing-now' : 'fav-item'; 
				
				div.style.display = 'flex'; 
				div.style.justifyContent = 'space-between';
				div.style.alignItems = 'center';
				div.style.transition = 'background 0.2s ease';

				// --- NATIVE DESKTOP DRAG EVENTS ---
				div.ondragover = (e) => { 
					e.preventDefault(); 
					div.classList.add('drag-over'); 
				};
				div.ondragleave = () => { div.classList.remove('drag-over'); };
				div.ondrop = (e) => {
					e.preventDefault();
					div.classList.remove('drag-over');
					const draggedIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
					if (draggedIndex !== i) {
						let playlistsUpdate = getAllPlaylists();
						let favs = playlistsUpdate[currentPlaylist];
						const [item] = favs.splice(draggedIndex, 1);
						favs.splice(i, 0, item);
						localStorage.setItem("yt_playlists", JSON.stringify(playlistsUpdate));
						renderFavorites(); 
					}
				};

				// 1. ISOLATED DRAG HANDLE (With robust Touch isolation)
				const dragHandle = document.createElement('span');
				dragHandle.innerText = '☰ ';
				dragHandle.style.cursor = 'move';
				dragHandle.style.padding = '12px 16px'; 
				dragHandle.style.color = '#888';
				dragHandle.draggable = true; 
				
				dragHandle.style.userSelect = 'none';
				dragHandle.style.webkitUserSelect = 'none';
				dragHandle.style.webkitTouchCallout = 'none';
				dragHandle.oncontextmenu = (e) => { e.preventDefault(); };

				// MOBILE TOUCH IMPLEMENTATION (Fixed for Firefox Touch Persistence)
				let activeTouchIndex = i;

				dragHandle.ontouchstart = (e) => {
					if (e.cancelable) e.preventDefault();
					div.classList.add('dragging-now');
					activeTouchIndex = i;
				};

				dragHandle.ontouchmove = (e) => {
					if (e.cancelable) e.preventDefault();
					const touch = e.touches[0]; 
					
					const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
					if (!elementUnderTouch) return;
					
					const targetRow = elementUnderTouch.closest('.fav-item');
					if (targetRow && targetRow !== div) {
						const allRows = Array.from(container.children);
						const targetIndex = allRows.indexOf(targetRow);
						
						if (targetIndex !== -1 && activeTouchIndex !== targetIndex) {
							activeTouchIndex = targetIndex;
							
							let playlistsUpdate = getAllPlaylists();
							let favs = playlistsUpdate[currentPlaylist];
							const [item] = favs.splice(i, 1);
							favs.splice(targetIndex, 0, item);
							localStorage.setItem("yt_playlists", JSON.stringify(playlistsUpdate));
							
							if (targetIndex > i) {
								container.insertBefore(div, targetRow.nextSibling);
							} else {
								container.insertBefore(div, targetRow);
							}
						}
					}
				};
		 
				dragHandle.ontouchend = () => {
					div.classList.remove('dragging-now');
					if (window.getSelection) { window.getSelection().removeAllRanges(); }
					if (document.activeElement) { document.activeElement.blur(); }
					renderFavorites();
				};

				// DESKTOP MOUSE CODES
				dragHandle.ondragstart = (e) => {
					e.dataTransfer.setData('text/plain', i);
					div.classList.add('dragging-now'); 
				};
				dragHandle.ondragend = () => { 
					div.classList.remove('dragging-now'); 
				};
				div.appendChild(dragHandle);

				// 2. Title Element
				const titleSpan = document.createElement('span');
				titleSpan.innerText = video.title;
				titleSpan.style.cursor = 'pointer';
				titleSpan.style.flexGrow = '1';
				titleSpan.onclick = () => {
					currentQueueType = "favorites";
					startPlayback(video.id, video.title);
				};
				div.appendChild(titleSpan);

				// 3. Arrow Control Elements
				const reorderContainer = document.createElement('span');
				reorderContainer.style.display = 'flex';
				reorderContainer.style.gap = '5px';
				reorderContainer.style.marginRight = '10px';

				const upBtn = document.createElement('span');
				upBtn.innerText = '▲';
				upBtn.style.cursor = 'pointer';
				upBtn.style.fontSize = '12px';
				if (i === 0) {
					upBtn.style.visibility = 'hidden';
				} else {
					upBtn.onclick = () => moveFavorite(i, -1);
				}

				const downBtn = document.createElement('span');
				downBtn.innerText = '▼';
				downBtn.style.cursor = 'pointer';
				downBtn.style.fontSize = '12px';
				if (i === favorites.length - 1) {
					downBtn.style.visibility = 'hidden';
				} else {
					downBtn.onclick = () => moveFavorite(i, 1);
				}

				reorderContainer.appendChild(upBtn);
				reorderContainer.appendChild(downBtn);
				div.appendChild(reorderContainer);

				// 4. Delete Action Control Span
				const removeBtn = document.createElement('span');
				removeBtn.innerText = ' ❌';
				removeBtn.style.cursor = 'pointer';
				removeBtn.style.padding = '0 5px';
				removeBtn.onclick = (e) => {
					e.stopPropagation();
					removeFromFavorites(video.id);
				};
				div.appendChild(removeBtn);
				
				container.appendChild(div);
			});
		}

		// UPDATED REORDERING FUNCTION (Arrows ▲ ▼)
		function moveFavorite(index, direction) {
			let playlists = getAllPlaylists();
			let favorites = playlists[currentPlaylist];
			const newIndex = index + direction;
			
			if (newIndex < 0 || newIndex >= favorites.length) return; 
			
			const temp = favorites[index];
			favorites[index] = favorites[newIndex];
			favorites[newIndex] = temp;
			
			localStorage.setItem("yt_playlists", JSON.stringify(playlists));
			renderFavorites();
		}

		// UPDATED INDIVIDUAL VIDEO REMOVAL FUNCTION
		function removeFromFavorites(videoId) {
			let playlists = getAllPlaylists();
			let favorites = playlists[currentPlaylist] || [];
			
			playlists[currentPlaylist] = favorites.filter(video => video.id !== videoId);
			
			localStorage.setItem("yt_playlists", JSON.stringify(playlists));
			renderFavorites();
		}

        
        // Monitor fullscreen layout shifts to force rotation on mobile Chrome
		document.addEventListener('fullscreenchange', function() {
			const iframeContainer = document.querySelector('.iframe-container');
			
			// Check if any element inside your player is currently in fullscreen mode
			if (document.fullscreenElement) {
				// Force the mobile browser to open horizontally
				if (screen.orientation && screen.orientation.lock) {
					screen.orientation.lock('landscape').catch(function(error) {
						console.log("Orientation lock ignored by browser setup:", error);
					});
				}
			} else {
				// Safely return to normal scrolling layout when exiting fullscreen
				if (screen.orientation && screen.orientation.unlock) {
					screen.orientation.unlock();
				}
			}
		});
		
		// 📥 EXPORT SYSTEM: Always packages everything into ONE clean file
		function exportPlaylists() {
			const playlists = localStorage.getItem("yt_playlists");
			if (!playlists) {
				alert("No playlists found to export!");
				return;
			}
			
			const blob = new Blob([playlists], { type: "application/json" });
			const url = URL.createObjectURL(blob);
			
			const a = document.createElement("a");
			a.href = url;
			// Saves as one global backup file
			a.download = "youtube_playlists_backup.json"; 
			document.body.appendChild(a);
			a.click();
			
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		}

		function importPlaylists(event) {
			const file = event.target.files[0]; // Explicitly get the first file
			if (!file) {
				console.log("No file selected.");
				return;
			}

			const reader = new FileReader();
			reader.onload = function(e) {
				try {
					console.log("File loaded successfully. Parsing JSON...");
					let importedData = JSON.parse(e.target.result);
					console.log("Imported Data:", importedData);
					
					// If the file comes from a single playlist export, we convert it to the correct structure
					if (importedData && importedData.type === "single_playlist_export") {
						const normalized = {};
						normalized[importedData.playlistName] = importedData.tracks;
						importedData = normalized;
					}

					// Check if it is a valid object
					if (importedData && typeof importedData === 'object' && !Array.isArray(importedData)) {
						
						// Display the selection window
						const choice = prompt(
							"How would you like to import your playlists?\n\n" +
							"Type '1' to SMART MERGE (Combines tracks inside lists, avoids duplicates 🌟)\n" +
							"Type '2' to OVERWRITE (Completely replaces everything with this backup)\n\n" +
							"Cancel or leave blank to abort."
						);

						console.log("User choice:", choice);
						let currentPlaylists = getAllPlaylists();

						if (choice === "1") {
							// 🌟 TRUE SMART MERGE: Iterate through each playlist individually
							for (const listName in importedData) {
								if (importedData.hasOwnProperty(listName)) {
									
									// If the playlist doesn't exist in the app yet, create it empty
									if (!currentPlaylists[listName]) {
										currentPlaylists[listName] = [];
									}
									
									const importedTracks = importedData[listName];
									if (Array.isArray(importedTracks)) {
										importedTracks.forEach(newVideo => {
											// 🔍 Track check: Does this video.id already exist in this specific playlist?
											const isDuplicate = currentPlaylists[listName].some(existingVideo => existingVideo.id === newVideo.id);
											
											// Only append to the list if it is NOT a duplicate!
											if (!isDuplicate) {
												currentPlaylists[listName].push(newVideo);
											}
										});
									}
								}
							}
							
							localStorage.setItem("yt_playlists", JSON.stringify(currentPlaylists));
							alert("Playlists merged successfully! All new tracks added, duplicates filtered out.");
							window.location.reload();
							
						} else if (choice === "2") {
							// ⚠️ OVERWRITE (Full replacement)
							if (confirm("Are you absolutely sure? This will wipe out all your current playlists and replace them.")) {
								localStorage.setItem("yt_playlists", JSON.stringify(importedData));
								alert("Database overwritten successfully!");
								window.location.reload();
							}
						} else {
							alert("Import canceled.");
						}
					} else {
						alert("Invalid backup file structure. Please ensure it's a valid playlists JSON.");
					}
				} catch (err) {
					console.error("Error during import:", err);
					alert("Error parsing backup file: " + err.message);
				}
			};
			reader.readAsText(file);
			event.target.value = ''; 
		}

	</script>
